name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: OK
        run: echo "ok"

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint changed frontend files
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --quiet
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF#origin/}"...HEAD -- 'frontend/*.ts' 'frontend/*.tsx' 'frontend/*.js' 'frontend/*.jsx' | sed 's|^frontend/||')
          if [ -z "$CHANGED" ]; then
            echo "No changed frontend files to lint."
            exit 0
          fi
          echo "$CHANGED" | xargs npx eslint
        working-directory: frontend

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff==0.16.9
      - name: Lint changed backend files
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --quiet
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF#origin/}"...HEAD -- 'backend/*.py')
          if [ -z "$CHANGED" ]; then
            echo "No changed backend files to lint."
            exit 0
          fi
          echo "$CHANGED" | xargs ruff check --force-exclude
