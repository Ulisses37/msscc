# Pre-commit hooks for MSSCC. Installed from the backend venv with
# pip install -r backend/requirements-dev.txt, then:
#   pre-commit install
#   pre-commit install --hook-type pre-push
# The four Ruff pins (ci.yml, backend/requirements-dev.txt, the rev below and
# additional_dependencies) must be bumped together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: ruff check backend (changed files, autofix)
        args: [--fix]
        files: "^backend/.*\\.py$"
        exclude: "^backend/.*/migrations/"
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: eslint
        name: eslint frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: "^frontend/.*\\.([cm]?[jt]sx?)$"
        stages: [pre-commit]

      # Pinned to test settings so an inherited DJANGO_SETTINGS_MODULE or DB_*
      # variable cannot change what this check tests, and so no running database
      # is needed. Those settings still import base.py, so backend/.env must be
      # present for DJANGO_SECRET_KEY and FIELD_ENCRYPTION_KEYS.
      # The venv path below is Windows-only; on macOS/Linux use
      # backend/venv/bin/python.
      - id: makemigrations-check
        name: django makemigrations --check
        entry: backend/venv/Scripts/python.exe backend/manage.py makemigrations --check --dry-run --settings=config.settings.test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff-check-backend
        name: ruff check backend (check only)
        entry: ruff check backend
        language: python
        additional_dependencies: ["ruff==0.16.9"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
