# Pre-commit hooks for MSSCC. Installed from the backend venv with
# pip install -r backend/requirements-dev.txt, then:
#   pre-commit install
#   pre-commit install --hook-type pre-push
# The four Ruff pins (ci.yml, backend/requirements-dev.txt, the rev below and
# additional_dependencies) must be bumped together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: ruff check backend (changed files, autofix)
        args: [--fix]
        files: "^backend/.*\\.py$"
        exclude: "^backend/.*/migrations/"
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: eslint
        name: eslint frontend
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: "^frontend/.*\\.([cm]?[jt]sx?)$"
        stages: [pre-commit]

      # Runs with the normal development settings, so backend/.env must be
      # present: settings import needs DJANGO_SECRET_KEY, FIELD_ENCRYPTION_KEYS
      # and the DB_* variables. The check attempts a connection to each
      # configured database; an unreachable local DB (for example, the Docker
      # Postgres container not running) only prints a RuntimeWarning, it does
      # not fail the hook.
      # The venv path below is Windows-only; on macOS/Linux use
      # backend/venv/bin/python.
      - id: makemigrations-check
        name: django makemigrations --check
        entry: backend/venv/Scripts/python.exe backend/manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff-check-backend
        name: ruff check backend (check only)
        entry: ruff check backend
        language: python
        additional_dependencies: ["ruff==0.16.9"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
